<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSR & XM Daily Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-purple-500 selection:text-white">

    <div class="max-w-2xl w-full mx-auto px-4 py-8 flex flex-col gap-6">
        
        <!-- Header Title -->
        <header class="text-center">
            <h1 class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-purple-400 via-fuchsia-300 to-pink-400 bg-clip-text text-transparent">
                Daily Tracker Dashboard
            </h1>
            <p class="text-xs text-slate-400 mt-1">Record and manage your daily GSR & XM counts</p>
        </header>

        <!-- TOP UI: Gradient Violet Dashboard Cards -->
        <section class="grid grid-cols-2 gap-4">
            <!-- Total XM Card -->
            <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-violet-600 via-purple-700 to-indigo-900 p-6 shadow-xl shadow-purple-950/50 border border-purple-500/30 flex flex-col justify-between">
                <div class="absolute -right-6 -bottom-6 text-white/10 text-7xl font-black pointer-events-none">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div>
                    <span class="text-xs font-semibold uppercase tracking-wider text-purple-200/80">Total XM</span>
                </div>
                <div class="mt-4">
                    <h2 id="totalXM" class="text-4xl font-extrabold tracking-tight text-white">0</h2>
                </div>
            </div>

            <!-- Total GSR Card -->
            <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-fuchsia-600 via-purple-700 to-pink-900 p-6 shadow-xl shadow-fuchsia-950/50 border border-fuchsia-500/30 flex flex-col justify-between">
                <div class="absolute -right-6 -bottom-6 text-white/10 text-7xl font-black pointer-events-none">
                    <i class="fa-solid fa-chart-pie"></i>
                </div>
                <div>
                    <span class="text-xs font-semibold uppercase tracking-wider text-fuchsia-200/80">Total GSR</span>
                </div>
                <div class="mt-4">
                    <h2 id="totalGSR" class="text-4xl font-extrabold tracking-tight text-white">0</h2>
                </div>
            </div>
        </section>

        <!-- MAIN INTERACTIVE UI: Only 2 Buttons & Input Form -->
        <main class="bg-slate-900/80 backdrop-blur-md rounded-2xl border border-slate-800 p-6 shadow-2xl flex flex-col gap-6">
            <div class="flex items-center justify-between border-b border-slate-800 pb-4">
                <h2 class="text-sm font-semibold tracking-wide text-slate-300 uppercase">Log Entry</h2>
                <span id="currentDateDisplay" class="text-xs text-slate-400 font-medium"></span>
            </div>

            <form id="trackerForm" onsubmit="handleSubmit(event)" class="flex flex-col gap-5">
                <!-- Date Picker -->
                <div class="flex flex-col gap-1.5">
                    <label for="entryDate" class="text-xs font-medium text-slate-400">Select Date</label>
                    <input type="date" id="entryDate" required
                        class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all">
                </div>

                <!-- Quantity Input -->
                <div class="flex flex-col gap-1.5">
                    <label for="entryAmount" class="text-xs font-medium text-slate-400">Amount / Quantity</label>
                    <input type="number" id="entryAmount" min="1" placeholder="e.g. 5" required
                        class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-all">
                </div>

                <!-- THE ONLY 2 BUTTONS: GSR and XM -->
                <div class="flex flex-col gap-2 pt-2">
                    <span class="text-xs font-medium text-slate-400">Choose type to record:</span>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" onclick="submitEntry('XM')" 
                            class="group relative flex items-center justify-center gap-2 py-3.5 px-4 rounded-xl bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-bold text-sm shadow-lg shadow-violet-900/40 active:scale-[0.98] transition-all">
                            <i class="fa-solid fa-bolt text-violet-200 group-hover:scale-110 transition-transform"></i>
                            Log XM
                        </button>
                        
                        <button type="button" onclick="submitEntry('GSR')" 
                            class="group relative flex items-center justify-center gap-2 py-3.5 px-4 rounded-xl bg-gradient-to-r from-fuchsia-600 to-pink-600 hover:from-fuchsia-500 hover:to-pink-500 text-white font-bold text-sm shadow-lg shadow-fuchsia-900/40 active:scale-[0.98] transition-all">
                            <i class="fa-solid fa-chart-pie text-fuchsia-200 group-hover:scale-110 transition-transform"></i>
                            Log GSR
                        </button>
                    </div>
                </div>
            </form>
        </main>

        <!-- Database History / Logs Table -->
        <section class="bg-slate-900/50 backdrop-blur-md rounded-2xl border border-slate-800/80 p-5 flex flex-col gap-4">
            <div class="flex items-center justify-between">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Recent Database Logs</h3>
                <button onclick="clearDatabase()" class="text-[11px] text-red-400 hover:text-red-300 transition-colors font-medium">
                    <i class="fa-solid fa-trash-can mr-1"></i> Clear Data
                </button>
            </div>
            <div class="overflow-x-auto max-h-48 overflow-y-auto pr-1">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="text-slate-500 uppercase font-semibold border-b border-slate-800 sticky top-0 bg-slate-900/90 backdrop-blur">
                        <tr>
                            <th class="pb-2">Date</th>
                            <th class="pb-2">Type</th>
                            <th class="pb-2 text-right">Amount</th>
                            <th class="pb-2 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody" class="divide-y divide-slate-800/50">
                        <!-- Dynamic rows injected here -->
                    </tbody>
                </table>
                <div id="emptyState" class="text-center py-6 text-slate-500 text-xs hidden">
                    No records found in database yet.
                </div>
            </div>
        </section>

    </div>

    <!-- Footer -->
    <footer class="text-center py-4 text-[11px] text-slate-600">
        Local Database Storage Active &bull; Gradient Violet UI
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // Initialize Database from LocalStorage or empty array
        let database = JSON.parse(localStorage.getItem('tracker_db')) || [];

        // Set default date input to today
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('entryDate').value = todayStr;
        document.getElementById('currentDateDisplay').innerText = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

        // Handle Form Button Actions
        function submitEntry(type) {
            const dateVal = document.getElementById('entryDate').value;
            const amountVal = document.getElementById('entryAmount').value;

            if (!dateVal || !amountVal || amountVal <= 0) {
                alert('Please select a valid date and enter an amount greater than 0.');
                return;
            }

            const newRecord = {
                id: Date.now(),
                date: dateVal,
                type: type, // 'XM' or 'GSR'
                amount: parseFloat(amountVal)
            };

            database.unshift(newRecord); // Add to beginning of array
            saveAndRefresh();

            // Reset amount field only
            document.getElementById('entryAmount').value = '';
        }

        // Delete individual entry
        function deleteRecord(id) {
            database = database.filter(item => item.id !== id);
            saveAndRefresh();
        }

        // Clear entire database
        function clearDatabase() {
            if (confirm('Are you sure you want to clear all logged data?')) {
                database = [];
                saveAndRefresh();
            }
        }

        // Save data to localStorage and update UI view
        function saveAndRefresh() {
            localStorage.setItem('tracker_db', JSON.stringify(database));
            updateDashboard();
        }

        // Update totals and table view
        function updateDashboard() {
            let totalXM = 0;
            let totalGSR = 0;

            const tbody = document.getElementById('logsTableBody');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';

            if (database.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                database.forEach(item => {
                    if (item.type === 'XM') {
                        totalXM += item.amount;
                    } else if (item.type === 'GSR') {
                        totalGSR += item.amount;
                    }

                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-800/40 transition-colors';
                    tr.innerHTML = `
                        <td class="py-2.5 font-medium text-slate-300">${item.date}</td>
                        <td class="py-2.5">
                            <span class="px-2 py-0.5 rounded-md font-bold text-[10px] ${item.type === 'XM' ? 'bg-violet-500/20 text-violet-300 border border-violet-500/30' : 'bg-fuchsia-500/20 text-fuchsia-300 border border-fuchsia-500/30'}">
                                ${item.type}
                            </span>
                        </td>
                        <td class="py-2.5 text-right font-semibold text-slate-200">+${item.amount}</td>
                        <td class="py-2.5 text-right">
                            <button onclick="deleteRecord(${item.id})" class="text-slate-500 hover:text-red-400 transition-colors px-1">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // Animate/Update top numbers
            document.getElementById('totalXM').innerText = totalXM.toLocaleString();
            document.getElementById('totalGSR').innerText = totalGSR.toLocaleString();
        }

        // Initial UI Render on page load
        updateDashboard();
    </script>
</body>
</html>
